name: harness-cycle
on:
  pull_request:
    types: [closed]
jobs:
  after-merge:
    if: "${{ github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'cycle/') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
      - name: 承認をマージ先へ載せる。記録用 PR は開かない
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGED: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/land-cycle-receipt.mjs
