# ハーネス席 — ADR 0031 / 0033 / 0037 / 0039 / 0049
# 実行モデルはホストの既定。製品スラッグは書かない。席の名前は役割だけ。
# 第3の effort は medium。high には上げない。
# 検証用 subagent は起動しない（[[0051]]）。追加ゲートと review_trio は空。
harness_agents:
  model: host-default
  plan_gates:
    - plan-confirm
  extra_gates: []
  review_trio: []
  budget_guards:
    parent_chat: host-default
    gate_input: artifacts-only
    third_lens_seat: none
    no_named_model: true
    extra_seat: human-requested-once
    implement_seat: host-default
    trio_when: never
    plan_confirm_when: before-fanout-only
    no_generic_task_as_gate: true
    no_mixed_review_trio: true
    product_slug_required: false
# 親と実装の既定 effort は high（[[0049]]）。medium は許可に残し、ピンにはしない。
# 幅1の上書きは packet.rego が deny。ゲートを親が下げることも不可。
effort_defaults:
  parent: high
  implement: high
  gate: high
  third: medium
  ceiling: high
effort_allow:
  parent:
    - high
    - medium
  implement:
    - high
    - medium
  gate:
    - high
  third:
    - medium
  ceiling:
    - high
escalate:
  - stay
  - trio
  - ceiling
  - human
context_mode:
  - isolated
  - packet
dispatch_seats:
  parent: parent
  implement: implement
  plan_confirm: plan
  review: review
  review_trio: []
